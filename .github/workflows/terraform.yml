name: Terraform Plan

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '5.0.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure backend env
        run: |
          echo "ARM_STORAGE_ACCOUNT_NAME=${{ secrets.ARM_STORAGE_ACCOUNT_NAME }}" >> $GITHUB_ENV
          echo "ARM_ACCESS_KEY=${{ secrets.ARM_STORAGE_ACCOUNT_KEY }}" >> $GITHUB_ENV

      - name: Terraform Fmt Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -input=false -no-color

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan (binary)
        working-directory: ./terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Save binary plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-binary
          path: terraform/tfplan

      - name: Save human readable plan
        working-directory: ./terraform
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload plan text artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-text
          path: terraform/plan.txt

      - name: Post plan to PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Terraform Plan for** `${{ github.head_ref }}` → `main`
            ```
            $(cat terraform/plan.txt)
            ```
